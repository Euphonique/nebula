[package]
name = "nebula"
version = "1.1.0"
edition = "2024"
description = "Fast native code editor with built-in FTP/SFTP remote editing"
license = "MIT"
homepage = "https://github.com/Euphonique/nebula"
repository = "https://github.com/Euphonique/nebula"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "persistence"] }
ropey = "1.6.1"
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.25.1"
tree-sitter-json = "0.24.8"
suppaftp = { version = "12.2.1", features = ["native-tls", "deprecated"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
agent-client-protocol-schema = { version = "1.12.0", default-features = false }
directories = "6.0.0"
keyring = "4.2.0"
rfd = "0.17.2"
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
regex = "1.13.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-bash = "0.25.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = "0.5.3"
tree-sitter-xml = "0.7.0"
tree-sitter-lua = "0.5.0"
tree-sitter-sequel = "0.3.11"
tree-sitter-diff = "0.1.0"
tree-sitter-ini = "1.4.0"
raw-window-handle = "0.6"
wry = { version = "0.57.0", default-features = false, features = ["devtools", "os-webview"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rquickjs = { version = "0.14.0", features = ["futures", "classes", "properties", "array-buffer", "loader", "macro"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip", "json"] }
sha2 = "0.10.9"
png = "0.18"
vt100 = "0.17.0"
notify = { version = "8.2.0", default-features = false }
portable-pty = "0.9.0"
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
roxmltree = "0.21.1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell"] }
# Same version as wry uses: screenshots of the preview (CapturePreview).
webview2-com = "0.39.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_System_Time", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "linux")'.dependencies]
# X11 only (XWayland under Wayland): wry can embed the preview web view as a
# child window only on X11.
eframe = { version = "0.37.0", default-features = false, features = ["x11"] }
# accesskit_winit turns winit's Wayland backend on too; main() picks X11 (with_x11).
winit = { version = "0.30", default-features = false, features = ["x11"] }
arboard = { version = "3.7.0", default-features = false }
# Embedding the preview as an X11 child window (a default feature of wry,
# which the main dependency turns off).
wry = { version = "0.57.0", default-features = false, features = ["x11"] }
# The GTK wry builds on: initialized and pumped for the preview web view.
gtk = "0.18.2"
# Text on the GTK print dialog's cairo pages (same 0.18 line as gtk).
pangocairo = "0.18"
# Preview screenshots (snapshot); the exact version wry builds on.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# PNG encoding of the snapshot surface.
cairo-rs = { version = "0.18", features = ["png"] }
# Releasing winit's pointer grab before a GTK drag starts (same version as wry).
x11-dl = "2.21"
libc = "0.2"

# The Linux package (cargo install cargo-deb):
#   cargo deb --compress-debug-symbols=zlib
# zlib keeps the separate debug symbols readable for Rust's backtraces.
[package.metadata.deb]
maintainer = "Pascal Pagel"
copyright = "2026 Euphonique"
license-file = ["LICENSE", "0"]
section = "editors"
priority = "optional"
# Line tables go into a separate nebula-dbgsym package; the program keeps
# its symbol table, so crash reports still name functions.
dbgsym = true
extended-description = """\
Nebula is a fast native code editor with built-in FTP/SFTP remote editing: \
open server files like local ones, upload on save, sync and publish projects, \
a live HTML/PHP preview, an integrated terminal, Git status, spell checking \
and AI agents (ACP/MCP)."""
# $auto: the shared libraries (WebKitGTK, GTK 3 …) found by dpkg-shlibdeps.
depends = "$auto, xdg-utils"
# Command line tools Nebula calls: spell checking, trash/settings/D-Bus,
# opening links, the application menu cache, a terminal for agent logins.
recommends = "enchant-2, hunspell-en-us, libglib2.0-bin, libgtk-3-bin, desktop-file-utils, gnome-terminal | x-terminal-emulator"
suggests = "hunspell-de-de, git, nodejs"
assets = [
    ["target/release/nebula", "usr/bin/", "755"],
    ["packaging/linux/nebula.desktop", "usr/share/applications/", "644"],
    ["target/release/icons/16x16/nebula.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["target/release/icons/24x24/nebula.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["target/release/icons/32x32/nebula.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["target/release/icons/48x48/nebula.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["target/release/icons/64x64/nebula.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["target/release/icons/128x128/nebula.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["target/release/icons/256x256/nebula.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["target/release/icons/512x512/nebula.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["README.md", "usr/share/doc/nebula/", "644"],
    ["CHANGELOG.md", "usr/share/doc/nebula/", "644"],
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Function names and lines for crash report backtraces; on Windows they
# live in nebula.pdb, the exe stays the same size.
debug = "line-tables-only"
strip = false

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
async-trait = "0.1"
opensrv-mysql = { version = "0.7.0", default-features = false }
libunftp = { version = "0.23.1", default-features = false, features = ["ring"] }
tempfile = "3.27.0"
unftp-sbe-fs = "0.4.0"

[build-dependencies]
png = "0.18"
winresource = "0.1.34"

# Optimized but quick to build, for performance measurements:
# cargo test --profile perf bench_file -- --ignored --nocapture
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"
